name: Check template propagation
# Fails when a pull request changes an older minor's template without changing the newest minor's.
# Meant to be required on main through a ruleset. See "Deciding where to make your change" in CONTRIBUTING.md.
on:
  pull_request:
    branches: [main]
    # labeled/unlabeled rerun the check when a maintainer adds or removes the template-propagation-scoped label.
    # No paths filter: a required check that never reports leaves the pull request pending forever. The check
    # passes straight away when no template files change.
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  check:
    name: Check template propagation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # The check needs the base commit's history to diff against, but only file names, not contents.
          fetch-depth: 0
          filter: blob:none
      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # For pull_request events, github.sha is the pull request merged into main.
          HEAD_SHA: ${{ github.sha }}
          SCOPED: ${{ contains(github.event.pull_request.labels.*.name, 'template-propagation-scoped') }}
        run: python3 .github/workflows/utils/check_template_propagation.py
