# Workflow to start nightly build(s) upon new image version release.
# Triggered by release (https://github.com/aws/sagemaker-distribution/releases) publication, for `*-cpu` only so we run once per image version.
# Can also be triggered manually.
# When a minor version (X.y.0) is released, we'll start the next minor (X.(y+1).0) and patch (X.y.1).
# When a patch version (X.y.z) is released, we'll start the next patch (X.y.(z+1)).
#
# The actual schedule update logic runs in CodeBuild (NightlyScheduleUpdater) which supports
# concurrentBuildLimit: 1 with a queue depth of up to 5000, solving GitHub's concurrency
# group queue limit of 1 that caused silently dropped updates.
name: Add New Nightly Build(s)
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: 'Released version to add next versions for (x.y.z)'
                required: true
                type: string
jobs:
    update-nightly-schedule:
        name: Trigger NightlyScheduleUpdater CodeBuild job.
        runs-on: ubuntu-latest
        # Only run for CPU releases or manual triggers
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'release' && endsWith(github.event.release.tag_name, '-cpu'))
        permissions:
            id-token: write
        steps:
            - name: Set version
              id: version
              # Pass event data via env vars rather than ${{ }} interpolation
              # https://docs.github.com/en/actions/reference/security/secure-use#good-practices-for-mitigating-script-injection-attacks
              env:
                EVENT_NAME: ${{ github.event_name }}
                TAG_NAME: ${{ github.event.release.tag_name }}
                INPUT_VERSION: ${{ inputs.version }}
              run: |
                if [ "$EVENT_NAME" == "release" ]; then
                    VERSION="${TAG_NAME%-cpu}"
                else
                    VERSION="$INPUT_VERSION"
                fi
                # Fail fast on anything other than x.y.z so the output is safe to use downstream.
                if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "❌ Invalid version: '$VERSION' (expected x.y.z)"
                    exit 1
                fi
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{ secrets.START_CODEBUILD_ROLE }}
                aws-region: us-east-1
                role-duration-seconds: 900
                audience: https://sts.us-east-1.amazonaws.com
            - name: Start CodeBuild (with retry)
              env:
                VERSION: ${{ steps.version.outputs.version }}
              run: |
                for i in $(seq 1 10); do
                  if aws codebuild start-build \
                    --project-name NightlyScheduleUpdater \
                    --environment-variables-override "name=VERSION,value=${VERSION},type=PLAINTEXT" \
                    --source-version main \
                    --query 'build.id' --output text; then
                    echo "✅ Queued NightlyScheduleUpdater for version ${VERSION}"
                    exit 0
                  fi
                  echo "⏳ Attempt $i/10 failed, retrying in 60s..."
                  sleep 60
                done
                echo "❌ Failed after 10 attempts"
                exit 1
